name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 minutos (UTC)
  workflow_dispatch: # permite rodar manualmente em Actions → Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render (keep free tier awake)
        run: |
          set +x
          URL="https://orbital-leads-crm.onrender.com/"
          echo "Ping $URL $(date -u)"
          curl -fsS --retry 2 --max-time 20 "$URL" -o /dev/null -w "HTTP %{http_code} %{size_download}b in %{time_total}s\n"
          echo "ok"
