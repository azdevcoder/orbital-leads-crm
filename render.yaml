services:
  - type: web
    name: orbital-leads-crm
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm drizzle-kit migrate
    startCommand: pnpm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: orbital-leads-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: orbital-leads-db
    region: frankfurt
    plan: free
    databaseName: orbital_leads
    user: orbital_leads
